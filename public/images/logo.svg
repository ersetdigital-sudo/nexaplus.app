<svg width="420" height="100" viewBox="0 0 420 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NexaPlus">
  <defs>
    <linearGradient id="xGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="plusGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <text x="0" y="72" font-family="Inter, system-ui, sans-serif" font-size="78" font-weight="700" letter-spacing="-2">
    <tspan fill="#FFFFFF">ne</tspan><tspan fill="url(#xGradient)">x</tspan><tspan fill="#FFFFFF">a</tspan>
  </text>
  <text x="232" y="72" font-family="Inter, system-ui, sans-serif" font-size="78" font-weight="700" letter-spacing="-2" fill="url(#plusGradient)">plus</text>
